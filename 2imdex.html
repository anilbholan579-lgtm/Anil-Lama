<body>

    <!-- Floating Hearts -->
    <div class="hearts-layer" id="heartsLayer"></div>

    <!-- Card -->
    <div class="card">
        <!-- Audio Bar -->
        <div class="audio-bar" id="audioToggle">
            <div class="audio-btn" id="audioIcon">▶</div>
            <div class="audio-lbl" id="audioStatus">Play Music 🎵</div>
        </div>

        <h1 class="title-name">Dear Aashika</h1>
        <h2 class="title-sub">I Have Something to Tell You ❤️</h2>

        <!-- Couple Aesthetic Photos -->
        <div class="photo-box">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Couple 1" class="couple-img active">
            <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=600&q=80" alt="Couple 2" class="couple-img">
            <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=600&q=80" alt="Couple 3" class="couple-img">
            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80" alt="Couple 4" class="couple-img">
        </div>

        <div class="question">Will you be mine forever? ❤️</div>

        <!-- Buttons -->
        <div class="btn-wrap">
            <button class="btn btn-yes" id="yesBtn">YES ❤️</button>
            <button class="btn btn-no" id="noBtn">NO 💔</button>
        </div>
    </div>

    <!-- Celebration Popup -->
    <div class="popup-mask" id="popupMask">
        <div class="popup-content">
            <h2>Yay! Forever! 💖</h2>
            <p>I knew you loved me too! ❤️<br>Love you so much, Darling! 💖</p>
            <button class="btn-close" id="closePopup">Close 💕</button>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Music Stream -->
    <audio id="bgSong" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-love-112185.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Audio Logic
        const bgSong = document.getElementById('bgSong');
        const audioToggle = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        const audioStatus = document.getElementById('audioStatus');
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                bgSong.pause();
                audioIcon.textContent = '▶';
                audioStatus.textContent = 'Play Music 🎵';
                isPlaying = false;
            } else {
                bgSong.play().then(() => {
                    audioIcon.textContent = '⏸';
                    audioStatus.textContent = 'Playing Music... 💖';
                    isPlaying = true;
                }).catch(() => {
                    audioStatus.textContent = 'Tap to Play Music 🎵';
                });
            }
        }

        audioToggle.addEventListener('click', togglePlay);

        // Auto start audio on tap
        document.body.addEventListener('touchstart', function startAudio() {
            if(!isPlaying) togglePlay();
            document.body.removeEventListener('touchstart', startAudio);
        }, { once: true });

        // 2. Photo Slideshow
        const imgs = document.querySelectorAll('.couple-img');
        let imgIdx = 0;

        setInterval(() => {
            imgs[imgIdx].classList.remove('active');
            imgIdx = (imgIdx + 1) % imgs.length;
            imgs[imgIdx].classList.add('active');
        }, 3000);

        // 3. Floating Hearts
        const heartsLayer = document.getElementById('heartsLayer');
        const icons = ['❤️', '💖', '💕', '💗', '✨'];

        function addHeart() {
            const h = document.createElement('div');
            h.className = 'heart-item';
            h.textContent = icons[Math.floor(Math.random() * icons.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 18 + 14) + 'px';
            const duration = Math.random() * 3 + 4;
            h.style.animationDuration = duration + 's';

            heartsLayer.appendChild(h);
            setTimeout(() => h.remove(), duration * 1000);
        }

        setInterval(addHeart, 350);

        // 4. Escaping NO Button
        const noBtn = document.getElementById('noBtn');

        function escapeBtn(e) {
            if(e) e.preventDefault();
            const w = noBtn.offsetWidth || 80;
            const h = noBtn.offsetHeight || 40;

            const x = Math.max(20, Math.floor(Math.random() * (window.innerWidth - w - 20)));
            const y = Math.max(20, Math.floor(Math.random() * (window.innerHeight - h - 20)));

            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.zIndex = '999';
        }

        noBtn.addEventListener('touchstart', escapeBtn);
        noBtn.addEventListener('mouseover', escapeBtn);
        noBtn.addEventListener('click', escapeBtn);

        // 5. YES Button Popup & Confetti
        const yesBtn = document.getElementById('yesBtn');
        const popupMask = document.getElementById('popupMask');
        const closePopup = document.getElementById('closePopup');

        yesBtn.addEventListener('click', () => {
            if(!isPlaying) togglePlay();
            popupMask.classList.add('active');
            startConfetti();
        });

        closePopup.addEventListener('click', () => {
            popupMask.classList.remove('active');
            stopConfetti();
        });

        // 6. Confetti
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        let animId = null;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 8 + 6;
                this.color = ['#ff4757', '#2ed573', '#ffa502', '#1e90ff', '#ffffff'][Math.floor(Math.random() * 5)];
                this.vy = Math.random() * 4 + 2;
                this.vx = Math.random() * 2 - 1;
            }
            update() {
                this.y += this.vy;
                this.x += this.vx;
                if(this.y > canvas.height) this.y = -10;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function startConfetti() {
            dots = Array.from({length: 100}, () => new Particle());
            renderConfetti();
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => { d.update(); d.draw(); });
            animId = requestAnimationFrame(renderConfetti);
        }

        function stopConfetti() {
            if(animId) cancelAnimationFrame(animId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
